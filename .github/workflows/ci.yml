name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: MapLibre expression guard
        run: npm run verify:maplibre

      - name: UI token baseline
        run: npm run verify:ui-tokens

      - name: Product spec SSOT
        run: npm run verify:product-spec

      - name: Typecheck
        run: npx tsc --noEmit --pretty false
