name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read
  pull-requests: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Match local lockfile generation (npm 11 / Node 24)
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci --no-fund --no-audit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: MapLibre expression guard
        run: npm run verify:maplibre

      - name: UI token baseline
        run: npm run verify:ui-tokens

      - name: Product spec SSOT
        run: npm run verify:product-spec

      - name: Workers static asset size (25 MiB)
        run: npm run verify:workers-assets

      - name: Typecheck
        run: npx tsc --noEmit --pretty false

      - name: Security guard (fail-open 인증·시크릿 하드코딩)
        run: npm run verify:security

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci --no-fund --no-audit

      - name: Install browsers (PR — chromium only)
        if: github.event_name == 'pull_request'
        run: npx playwright install --with-deps chromium

      - name: Install browsers (push — chromium · webkit)
        if: github.event_name != 'pull_request'
        run: npx playwright install --with-deps chromium webkit

      - name: Smoke (PR — chromium)
        if: github.event_name == 'pull_request'
        run: npm run test:e2e:chromium

      - name: Smoke (push — chromium · webkit)
        if: github.event_name != 'pull_request'
        run: npm run test:e2e:ci

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # 프로덕션 high/critical — Next 14 잠금 항목만 게이트 스크립트에서 allowlist.
      - name: npm audit (production deps)
        run: node scripts/ci-npm-audit-gate.js

      - name: npm audit (all deps, report only)
        run: npm audit || true
        continue-on-error: true

      # gitleaks-action@v2 needs pull-requests:read for PR commits API;
      # run the binary directly so contents:read is enough.
      - name: Secret scan (gitleaks)
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz" \
            | sudo tar xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --verbose --redact --no-banner --config .gitleaks.toml
